[build]
  command = "npm run build"
  # Don't set publish - let Netlify Next.js runtime handle it

[build.environment]
  NODE_VERSION = "20"

# Enable Netlify Image CDN
[images]
  remote_images = ["https://talirecorderlessons.com/.*", "https://i.ytimg.com/.*", "https://substackcdn.com/.*"]

[[plugins]]
package = "@netlify/plugin-sitemap"

  [plugins.inputs]
  buildDir = ".next"
  exclude = [
    '/api/**',
    '/success',
    '/checkout'
  ]
  prettyURLs = true